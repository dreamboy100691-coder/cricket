<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Cricket Scorer Pro • Complete Match Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-primary: #06080d;
            --bg-secondary: #0a0e17;
            --bg-card: rgba(20, 25, 35, 0.85);
            --bg-card-hover: rgba(30, 37, 50, 0.9);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --border-color: rgba(30, 41, 59, 0.7);
            --glass-bg: rgba(10, 14, 23, 0.75);
            --radius-2xl: 24px;
            --radius-xl: 18px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-full: 9999px;
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 10% 5%, rgba(59,130,246,0.1) 0%, transparent 45%),
                radial-gradient(ellipse at 90% 95%, rgba(139,92,246,0.1) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 50%, rgba(6,182,212,0.05) 0%, transparent 60%);
            font-family: 'Inter', 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            padding: 18px 16px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .match-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .match-type-badge {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        .team-names {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .icon-btn:hover {
            background: var(--bg-card-hover);
            color: #fff;
            border-color: rgba(59,130,246,0.3);
            box-shadow: 0 0 20px rgba(59,130,246,0.15);
        }
        .icon-btn.active {
            background: var(--accent-purple);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 20px rgba(139,92,246,0.4);
        }

        /* Score Display */
        .score-display {
            text-align: center;
            padding: 12px 0 4px;
        }
        .score-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
        }
        .runs-big {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: clamp(4.5rem, 16vw, 7rem);
            line-height: 1;
            background: linear-gradient(180deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 12px rgba(59,130,246,0.4));
        }
        .sep {
            font-size: clamp(3rem, 12vw, 5.5rem);
            color: var(--text-tertiary);
            opacity: 0.4;
            font-weight: 300;
        }
        .wickets-big {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 900;
            font-size: clamp(4.5rem, 16vw, 7rem);
            line-height: 1;
            background: linear-gradient(180deg, #f87171, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 4px 12px rgba(239,68,68,0.4));
        }
        .overs-display {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
        }
        .overs-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-tertiary);
            display: block;
        }

        /* Stats Row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 8px 0;
        }
        .stat-item {
            text-align: center;
            padding: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-cyan);
        }
        .stat-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .stat-value.rr { color: var(--accent-blue); }
        .stat-value.rrr { color: var(--accent-orange); }

        /* Target Banner */
        .target-banner {
            background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(59,130,246,0.15));
            border: 1px solid rgba(139,92,246,0.3);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            animation: slideDown 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .target-banner .badge {
            background: var(--accent-purple);
            color: #fff;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-weight: 700;
        }

        /* Runboard */
        .runboard {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px 0;
        }
        .ball-dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(30,37,50,0.5);
            border: 2px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .ball-dot.current {
            border-color: var(--accent-blue);
            background: rgba(59,130,246,0.2);
            color: #fff;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 14px rgba(59,130,246,0.4); }
            50% { box-shadow: 0 0 28px rgba(59,130,246,0.7); }
        }
        .ball-dot.wicket { border-color: var(--accent-red); color: #f87171; }
        .ball-dot.four { border-color: var(--accent-green); color: #34d399; }
        .ball-dot.six { border-color: var(--accent-orange); color: #fbbf24; }

        /* Batsmen Info */
        .batsmen-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0;
        }
        .batsman-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .batsman-card.striker {
            border-color: rgba(59,130,246,0.3);
            background: rgba(59,130,246,0.05);
        }
        .batsman-name {
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-primary);
        }
        .batsman-score {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--accent-cyan);
        }
        .batsman-detail {
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }
        .striker-indicator {
            color: var(--accent-blue);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Action Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 8px 0;
        }
        .action-btn {
            padding: 14px 8px;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(30,37,50,0.5);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            backdrop-filter: blur(10px);
        }
        .action-btn:hover {
            background: rgba(40,47,60,0.7);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn.wicket-btn { border-color: rgba(239,68,68,0.3); color: #f87171; }
        .action-btn.extras-btn { border-color: rgba(6,182,212,0.3); color: #22d3ee; }
        .action-btn.dot-btn { color: var(--text-secondary); }
        .action-btn.no-ball-active {
            background: var(--accent-blue) !important;
            border-color: var(--accent-blue) !important;
            color: #fff !important;
            animation: pulse 1.5s infinite;
        }

        /* Bottom Row */
        .bottom-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .bottom-btn {
            padding: 12px 8px;
            border-radius: var(--radius-lg);
            background: rgba(30,37,50,0.5);
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .bottom-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .bottom-btn.active-btn { color: #34d399; border-color: rgba(16,185,129,0.3); }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } }
        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius-2xl);
            border: 1px solid rgba(255,255,255,0.08);
            width: 94%;
            max-width: 500px;
            max-height: 88vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
            animation: modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            z-index: 10;
            border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
        }
        .modal-header h3 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }
        .modal-close {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: var(--accent-red); border-color: var(--accent-red); color: #fff; }
        .modal-body { padding: 16px 20px; }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .btn {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent-blue); color: #fff; }
        .btn-primary:hover { background: #2563eb; box-shadow: 0 8px 20px rgba(59,130,246,0.3); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-primary); border: 1px solid rgba(255,255,255,0.1); }
        .btn-danger { background: var(--accent-red); color: #fff; }
        .form-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }
        .form-input:focus { outline: none; border-color: var(--accent-blue); box-shadow: 0 0 16px rgba(59,130,246,0.15); }
        .form-group { margin-bottom: 12px; }
        .form-label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .player-list { max-height: 300px; overflow-y: auto; }
        .player-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .player-row input { flex: 1; }
        .score-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .score-table th {
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(255,255,255,0.06);
        }
        .score-table td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .innings-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
        .innings-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .innings-tab.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20,25,35,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-full);
            padding: 10px 22px;
            color: #fff;
            font-weight: 500;
            z-index: 2000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
            pointer-events: none;
            font-size: 0.85rem;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        @media (max-width: 400px) {
            .glass-card { padding: 14px 10px; }
            .actions-grid { gap: 6px; }
            .action-btn { padding: 12px 6px; font-size: 0.8rem; }
            .ball-dot { width: 32px; height: 32px; font-size: 0.7rem; }
            .runs-big, .wickets-big { font-size: clamp(3.5rem, 14vw, 5rem); }
            .bottom-row { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- Match Setup Screen -->
        <div id="setupScreen" class="glass-card" style="text-align:center;">
            <h2 style="font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:16px;">🏏 New Match Setup</h2>
            <div class="form-group">
                <label class="form-label">Match Type</label>
                <select class="form-input" id="matchType" style="text-align:center;">
                    <option value="T20">T20 (20 Overs)</option>
                    <option value="ODI">ODI (50 Overs)</option>
                    <option value="Custom">Custom Overs</option>
                </select>
            </div>
            <div class="form-group" id="customOversGroup" style="display:none;">
                <label class="form-label">Total Overs</label>
                <input type="number" class="form-input" id="customOvers" value="20" min="1" max="90" style="text-align:center;">
            </div>
            <div class="form-group">
                <label class="form-label">Team 1 Name</label>
                <input type="text" class="form-input" id="team1Name" value="Team A" style="text-align:center;">
            </div>
            <div class="form-group">
                <label class="form-label">Team 2 Name</label>
                <input type="text" class="form-input" id="team2Name" value="Team B" style="text-align:center;">
            </div>
            <button class="btn btn-primary" onclick="startMatch()" style="width:100%;padding:14px;font-size:1rem;">
                Start Match
            </button>
        </div>

        <!-- Main Match Screen (hidden initially) -->
        <div id="matchScreen" style="display:none;">
            <!-- Header -->
            <div class="glass-card">
                <div class="header">
                    <div class="match-info">
                        <span class="match-type-badge" id="matchTypeBadge">T20</span>
                        <span class="team-names" id="teamNamesDisplay">Team A vs Team B</span>
                    </div>
                    <div class="header-actions">
                        <button class="icon-btn" onclick="openModal('playersModal')" title="Edit Players">
                            <i class="fas fa-users"></i>
                        </button>
                        <button class="icon-btn" onclick="openModal('scoreboardModal')" title="Full Scoreboard">
                            <i class="fas fa-table"></i>
                        </button>
                        <button class="icon-btn" onclick="openModal('settingsModal')" title="Settings">
                            <i class="fas fa-cog"></i>
                        </button>
                    </div>
                </div>

                <!-- Score Display -->
                <div class="score-display">
                    <div class="score-row">
                        <span class="runs-big" id="displayRuns">0</span>
                        <span class="sep">/</span>
                        <span class="wickets-big" id="displayWickets">0</span>
                    </div>
                    <div class="overs-display">
                        <span class="overs-label">Overs</span>
                        <span id="displayOvers">0.0</span>
                    </div>
                </div>

                <!-- Stats Row -->
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value rr" id="currentRR">0.00</div>
                        <div class="stat-label">CRR</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="inningsDisplay">1st</div>
                        <div class="stat-label">Innings</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value rrr" id="requiredRR">-</div>
                        <div class="stat-label">RRR</div>
                    </div>
                </div>

                <!-- Target Banner -->
                <div class="target-banner" id="targetBanner">
                    <div id="targetContent"></div>
                </div>

                <!-- Runboard -->
                <div class="runboard" id="runboard">
                    <div class="ball-dot">•</div><div class="ball-dot">•</div><div class="ball-dot">•</div>
                    <div class="ball-dot">•</div><div class="ball-dot">•</div><div class="ball-dot">•</div>
                </div>

                <!-- Batsmen Info -->
                <div class="batsmen-info" id="batsmenInfo"></div>

                <!-- Action Buttons -->
                <div class="actions-grid">
                    <button class="action-btn dot-btn" onclick="performAction('dot')">•<span>Dot</span></button>
                    <button class="action-btn extras-btn" onclick="performAction('wide')"><i class="fas fa-arrow-right"></i><span>Wide</span></button>
                    <button class="action-btn extras-btn" id="btnNoBall" onclick="performAction('noball')"><i class="fas fa-exclamation-triangle"></i><span>No Ball</span></button>
                    <button class="action-btn" onclick="performAction('1')">1</button>
                    <button class="action-btn" onclick="performAction('2')">2</button>
                    <button class="action-btn" onclick="performAction('3')">3</button>
                    <button class="action-btn" onclick="performAction('4')">4</button>
                    <button class="action-btn" onclick="performAction('6')">6</button>
                    <button class="action-btn wicket-btn" onclick="performAction('wicket')"><i class="fas fa-times"></i><span>Wicket</span></button>
                </div>

                <!-- Bottom Row -->
                <div class="bottom-row">
                    <button class="bottom-btn" onclick="openModal('undoModal')"><i class="fas fa-undo"></i> Undo</button>
                    <button class="bottom-btn active-btn" onclick="openModal('scoreboardModal')"><i class="fas fa-list"></i> Scorecard</button>
                    <button class="bottom-btn" onclick="switchInnings()"><i class="fas fa-exchange-alt"></i> Innings</button>
                    <button class="bottom-btn" onclick="openModal('playersModal')"><i class="fas fa-user-edit"></i> Players</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Players Modal -->
    <div class="modal-overlay" id="playersModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>👥 Edit Players</h3>
                <button class="modal-close" onclick="closeModal('playersModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="innings-tabs">
                    <button class="innings-tab active" onclick="switchPlayerTab('team1')">Team 1</button>
                    <button class="innings-tab" onclick="switchPlayerTab('team2')">Team 2</button>
                </div>
                <div class="player-list" id="team1Players"></div>
                <div class="player-list" id="team2Players" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('playersModal')">Cancel</button>
                <button class="btn btn-primary" onclick="savePlayers()">Save Players</button>
            </div>
        </div>
    </div>

    <!-- Scoreboard Modal -->
    <div class="modal-overlay" id="scoreboardModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>📋 Full Scorecard</h3>
                <button class="modal-close" onclick="closeModal('scoreboardModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="innings-tabs">
                    <button class="innings-tab active" onclick="switchScorecardTab(0)">1st Innings</button>
                    <button class="innings-tab" onclick="switchScorecardTab(1)">2nd Innings</button>
                </div>
                <div id="scorecardContent"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('scoreboardModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>⚙️ Match Settings</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Total Overs</label>
                    <input type="number" class="form-input" id="editTotalOvers" min="1" max="90">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('settingsModal')">Cancel</button>
                <button class="btn btn-primary" onclick="updateSettings()">Save</button>
            </div>
        </div>
    </div>

    <!-- Undo Modal -->
    <div class="modal-overlay" id="undoModal" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>↩️ Undo Last Ball?</h3>
                <button class="modal-close" onclick="closeModal('undoModal')">✕</button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text-secondary);">This will remove the last recorded delivery.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('undoModal')">Cancel</button>
                <button class="btn btn-danger" onclick="undoLastBall()">Undo</button>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        let matchId = null;
        let matchData = null;
        const API_BASE = '';

        async function apiCall(endpoint, method = 'GET', body = null) {
            const options = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) options.body = JSON.stringify(body);
            const response = await fetch(`${API_BASE}${endpoint}`, options);
            return response.json();
        }

        function startMatch() {
            const matchType = document.getElementById('matchType').value;
            const team1Name = document.getElementById('team1Name').value || 'Team A';
            const team2Name = document.getElementById('team2Name').value || 'Team B';
            const totalOvers = matchType === 'Custom' ? 
                parseInt(document.getElementById('customOvers').value) || 20 : 
                (matchType === 'ODI' ? 50 : 20);

            apiCall('/api/match/new', 'POST', {
                team1_name: team1Name,
                team2_name: team2Name,
                total_overs: totalOvers,
                match_type: matchType
            }).then(result => {
                if (result.success) {
                    matchId = result.match_id;
                    matchData = result.match;
                    document.getElementById('setupScreen').style.display = 'none';
                    document.getElementById('matchScreen').style.display = 'block';
                    updateAllUI();
                    showToast('Match started! 🏏');
                }
            });
        }

        function performAction(action) {
            if (!matchId) return;
            apiCall(`/api/match/${matchId}/action`, 'POST', { action }).then(result => {
                if (result.success) {
                    matchData = result.match;
                    updateAllUI();
                } else {
                    showToast(result.message || 'Action failed');
                }
            });
        }

        function undoLastBall() {
            if (!matchId) return;
            apiCall(`/api/match/${matchId}/action`, 'POST', { action: 'undo' }).then(result => {
                if (result.success) {
                    matchData = result.match;
                    updateAllUI();
                    showToast('Ball undone');
                }
                closeModal('undoModal');
            });
        }

        function switchInnings() {
            if (!matchData) return;
            if (matchData.match_status === 'innings_break') {
                // Force start second innings
                matchData.current_innings = 1;
                updateAllUI();
                showToast('Switched to 2nd innings');
            }
        }

        function updateAllUI() {
            if (!matchData) return;
            const innings = matchData.innings[matchData.current_innings];
            if (!innings) return;

            document.getElementById('displayRuns').textContent = innings.total_runs;
            document.getElementById('displayWickets').textContent = innings.total_wickets;
            document.getElementById('displayOvers').textContent = innings.overs_display;
            document.getElementById('currentRR').textContent = innings.run_rate.toFixed(2);
            document.getElementById('inningsDisplay').textContent = 
                matchData.current_innings === 0 ? '1st' : '2nd';
            document.getElementById('requiredRR').textContent = 
                innings.required_run_rate > 0 ? innings.required_run_rate.toFixed(2) : '-';
            document.getElementById('matchTypeBadge').textContent = 
                matchData.match_type === 'Custom' ? `${matchData.total_overs} Ov` : matchData.match_type;
            document.getElementById('teamNamesDisplay').textContent = 
                `${matchData.team1_name} vs ${matchData.team2_name}`;

            updateRunboard();
            updateBatsmenInfo();
            updateTargetBanner();
        }

        function updateRunboard() {
            const innings = matchData?.innings[matchData.current_innings];
            if (!innings) return;
            const over = innings.scoreboard[innings.current_over - 1] || { balls: [] };
            const dots = document.querySelectorAll('#runboard .ball-dot');
            
            dots.forEach((dot, i) => {
                dot.classList.remove('current', 'wicket', 'four', 'six');
                dot.textContent = '•';
                dot.style.color = '';
                
                if (over.balls[i] !== undefined) {
                    const val = over.balls[i];
                    if (val === 'D') { dot.textContent = '•'; dot.style.color = '#64748b'; }
                    else if (val === 'W') { dot.textContent = 'W'; dot.classList.add('wicket'); }
                    else if (val === 4) { dot.textContent = '4'; dot.classList.add('four'); }
                    else if (val === 6) { dot.textContent = '6'; dot.classList.add('six'); }
                    else { dot.textContent = val; dot.style.color = '#e2e8f0'; }
                }
                
                if (i + 1 === innings.current_ball && innings.current_ball <= 6) {
                    dot.classList.add('current');
                }
            });
        }

        function updateBatsmenInfo() {
            if (!matchData) return;
            const players = matchData.batting_team_players || [];
            const [strikerIdx, nonStrikerIdx] = matchData.current_batsmen || [0, 1];
            
            const striker = players[strikerIdx] || { name: 'Striker', runs: 0, balls_faced: 0, strike_rate: 0 };
            const nonStriker = players[nonStrikerIdx] || { name: 'Non-Striker', runs: 0, balls_faced: 0, strike_rate: 0 };
            
            document.getElementById('batsmenInfo').innerHTML = `
                <div class="batsman-card striker">
                    <div>
                        <div class="striker-indicator">🏏 Striker</div>
                        <div class="batsman-name">${striker.name}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="batsman-score">${striker.runs}(${striker.balls_faced})</div>
                        <div class="batsman-detail">SR: ${striker.strike_rate}</div>
                    </div>
                </div>
                <div class="batsman-card">
                    <div>
                        <div class="batsman-name">${nonStriker.name}</div>
                    </div>
                    <div style="text-align:right;">
                        <div class="batsman-score">${nonStriker.runs}(${nonStriker.balls_faced})</div>
                        <div class="batsman-detail">SR: ${nonStriker.strike_rate}</div>
                    </div>
                </div>
            `;
        }

        function updateTargetBanner() {
            const innings = matchData?.innings[matchData.current_innings];
            const banner = document.getElementById('targetBanner');
            
            if (matchData?.current_innings === 1 && innings?.target) {
                banner.style.display = 'block';
                const runsNeeded = innings.target - innings.total_runs;
                const ballsLeft = (matchData.total_overs * 6) - 
                    ((innings.current_over - 1) * 6 + innings.current_ball - 1);
                
                if (runsNeeded <= 0 || ballsLeft <= 0) {
                    document.getElementById('targetContent').innerHTML = 
                        `<span style="font-size:1.1rem;">${runsNeeded <= 0 ? '🏆 Target Achieved!' : '⏰ Innings Complete'}</span>`;
                } else {
                    document.getElementById('targetContent').innerHTML = `
                        Need <span class="badge">${runsNeeded}</span> runs in 
                        <span class="badge">${ballsLeft}</span> balls
                    `;
                }
            } else {
                banner.style.display = 'none';
            }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 2800);
        }

        // Event listeners for setup
        document.getElementById('matchType').addEventListener('change', function() {
            document.getElementById('customOversGroup').style.display = 
                this.value === 'Custom' ? 'block' : 'none';
        });

        // Close modals on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.style.display = 'none';
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || !matchId) return;
            const key = e.key.toLowerCase();
            const shortcuts = {
                'd': 'dot', '1': '1', '2': '2', '3': '3', '4': '4', '6': '6',
                'w': 'wicket', 'e': 'wide', 'n': 'noball'
            };
            if (shortcuts[key]) {
                e.preventDefault();
                performAction(shortcuts[key]);
            }
            if ((key === 'z' && (e.ctrlKey || e.metaKey)) || key === 'u') {
                e.preventDefault();
                undoLastBall();
            }
        });
    </script>
</body>
</html>
